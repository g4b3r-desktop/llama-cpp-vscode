name: Package VSIX

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read extension version
        id: version
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - run: npm install -g @vscode/vsce
      - run: npm run check
      - run: npm test
      - name: Package VSIX
        run: vsce package --out llama-cpp-assistant-${{ steps.version.outputs.version }}.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-assistant-${{ steps.version.outputs.version }}
          path: '*.vsix'

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: llama-cpp-assistant-${{ needs.package.outputs.version }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.vsix --clobber
          else
            gh release create "$TAG" dist/*.vsix --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
