name: Package VSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read extension version
        id: version
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - run: npm install -g @vscode/vsce
      - run: npm run check
      - run: npm test
      - name: Package VSIX
        run: vsce package --out llama-cpp-assistant-${{ steps.version.outputs.version }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-assistant-${{ steps.version.outputs.version }}
          path: '*.vsix'
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.vsix --clobber
          else
            gh release create "$TAG" *.vsix --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
